name: Aviso diario GEHCH
on:
  schedule:
    # GitHub no garantiza la hora de las tareas programadas: se hacen 5 intentos (hora de RD = UTC-4)
    # y solo el primero que corre envía el aviso; los demás ven que ya salió y no envían nada.
    - cron: "13 10 * * *"   # 6:13 a. m.
    - cron: "43 10 * * *"   # 6:43 a. m.
    - cron: "13 11 * * *"   # 7:13 a. m.
    - cron: "43 11 * * *"   # 7:43 a. m.
    - cron: "13 12 * * *"   # 8:13 a. m.
  workflow_dispatch:         # botón "Run workflow" para probarlo a mano
jobs:
  aviso:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Firebase
        run: npm install --no-save --no-package-lock firebase-admin@12.7.0
        working-directory: aviso
      - name: Enviar aviso
        run: node aviso-diario.js
        working-directory: aviso
        env:
          FIREBASE_CRM: ${{ secrets.FIREBASE_CRM }}
          FIREBASE_RECLAMOS: ${{ secrets.FIREBASE_RECLAMOS }}
          EVENTO: ${{ github.event_name }}
