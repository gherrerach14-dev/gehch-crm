<style>
  :root{
    --navy:#0a1628; --navy2:#13284a; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --bg:#f2f4f8; --card:#ffffff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --blue:#2563eb;
  }
  :root{color-scheme:light dark}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;min-height:100vh}
  button,input,select,textarea{font:inherit;color:inherit}
  .top{background:var(--navy);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20}
  .top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .top img{height:38px;width:auto;border-radius:6px;background:#fff;padding:2px}
  .top .t1{font-weight:800;font-size:15px;letter-spacing:.2px}
  .top .t2{font-size:12px;color:rgba(255,255,255,.6)}
  .estado{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 9px;border-radius:99px;white-space:nowrap}
  .estado i{width:8px;height:8px;border-radius:99px;display:inline-block}
  .estado.ok{background:rgba(34,197,94,.15);color:#86efac}.estado.ok i{background:#22c55e}
  .estado.mal{background:rgba(239,68,68,.2);color:#fecaca}.estado.mal i{background:#ef4444}
  main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
  h1{font-size:22px;font-weight:800;margin:6px 0 4px}
  h2{font-size:16px;font-weight:800;margin:0 0 10px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 8px rgba(15,23,42,.06);border:1px solid #edf0f5}
  label.l{display:block;font-size:12px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px}
  input.f,select.f,textarea.f{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;background:#f8fafc;font-size:16px;outline:none}
  input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--blue);background:#fff}
  textarea.f{min-height:80px;resize:vertical}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;cursor:pointer;background:var(--navy);color:#fff;margin-top:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sec{background:#e9eef6;color:var(--ink)}
  .btn.ok{background:var(--ok)}
  .btn.wa{background:#25d366;color:#06301a}
  .btn.peq{width:auto;padding:9px 14px;font-size:14px;margin-top:0}
  .link{background:none;border:none;color:var(--blue);font-weight:700;cursor:pointer;padding:6px 0;font-size:15px}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{flex:1 1 140px;border:1.5px solid var(--line);background:#f8fafc;border-radius:10px;padding:12px;text-align:center;font-weight:700;cursor:pointer;font-size:15px}
  .opt.on{border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.35)}
  .opt.on .muted{color:#cbd5e1!important}
  .opt.on::before{content:"✓ Seleccionado";display:block;font-size:12px;font-weight:800;color:#86efac;margin-bottom:4px}
  .aviso{border-radius:10px;padding:11px 12px;font-size:14px;margin-top:10px}
  .aviso.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
  .aviso.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
  .aviso.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .aviso.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  .proc{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fbfcfe}
  .proc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .proc-t{font-weight:800}
  .proc-d{color:var(--muted);font-size:14px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);position:relative;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:99px;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer;line-height:20px}
  .file-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed #94a3b8;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;cursor:pointer;background:#fff;color:var(--navy2)}
  .file-btn input{display:none}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eef2f7}
  .li:last-child{border-bottom:none}
  .chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
  .muted{color:var(--muted);font-size:14px}
  .center{text-align:center}
  .big-ok{font-size:54px;text-align:center;margin:8px 0}
  .barra{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:10px}
  .barra i{display:block;height:100%;background:var(--blue);transition:width .2s}
  .pin{letter-spacing:12px;text-align:center;font-size:28px;font-weight:800}
  .legal{font-size:13px;color:#334155;max-height:260px;overflow:auto;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px}
  .legal p{margin-bottom:8px}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px}
  .check input{width:22px;height:22px;flex-shrink:0;margin-top:1px}
  .foot{color:#94a3b8;font-size:12px;text-align:center;margin-top:24px}
  .velo{position:fixed;inset:0;background:rgba(10,22,40,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
  .velo .caja{background:#fff;color:#0f172a;border-radius:16px;padding:22px;max-width:360px;width:100%;text-align:center}
  .velo .caja b{display:block;font-size:18px;margin-bottom:6px}
  .hero{background:linear-gradient(160deg,#0a1628 0%,#13284a 100%);color:#fff;border-radius:18px;padding:26px 20px 22px;text-align:center;margin-bottom:14px}
  .hero .logo{background:#fff;border-radius:14px;padding:10px 14px;display:inline-block;margin-bottom:16px}
  .hero .logo img{height:84px;width:auto;display:block}
  .hero h1{color:#fff;font-size:24px;margin:0 0 8px}
  .hero p{color:#cbd5e1;font-size:15px;margin:0}
  .pasos{display:flex;flex-direction:column;gap:12px}
  .paso{display:flex;gap:12px;align-items:flex-start}
  .paso b{flex-shrink:0;width:30px;height:30px;border-radius:99px;background:#eaf0fb;color:#0a1628;display:flex;align-items:center;justify-content:center;font-size:14px}
  .paso div{font-size:15px;padding-top:4px}
  .miembro{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7}
  .miembro:last-child{border-bottom:none}
  .avatar{width:42px;height:42px;border-radius:99px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#13284a,#2563eb)}
  .avatar.tit{background:linear-gradient(135deg,#0a1628,#0f766e)}
  .ok-ico{width:24px;height:24px;border-radius:99px;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0}
  .pend-ico{font-size:11px;font-weight:800;color:#92400e;background:#fef3c7;border-radius:99px;padding:3px 8px;flex-shrink:0}
  .rol{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  details.agregar summary{cursor:pointer;color:var(--blue);font-weight:700;list-style:none;padding:4px 0}
  details.agregar summary::-webkit-details-marker{display:none}
  @media (prefers-color-scheme: dark){ .miembro{border-color:#1f2a3d} }
  .seguro{display:flex;gap:10px;align-items:flex-start;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:12px;font-size:13px;margin-top:4px}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e5e7eb;--muted:#9ca3af;--line:#334155;--bg:#0b1220;--card:#111a2b}
    .card{border-color:#1f2a3d;box-shadow:none}
    input.f,select.f,textarea.f{background:#0f172a;color:#e5e7eb}
    input.f:focus,select.f:focus,textarea.f:focus{background:#0b1220}
    .opt{background:#0f172a;border-color:#334155}
    .opt.on{background:#2563eb;border-color:#93c5fd;color:#fff}
    .btn{background:#2563eb}.btn.sec{background:#1f2a3d;color:#e5e7eb}.btn.ok{background:#16a34a}
    .proc{background:#0f172a}.legal{background:#0f172a;color:#cbd5e1}
    .paso b{background:#1f2a3d;color:#e5e7eb}
    .li{border-color:#1f2a3d}.thumb,.file-btn{background:#0f172a;color:#cbd5e1}
    label.l{color:#94a3b8}.link{color:#60a5fa}
    .aviso.info{background:#0c1d3a;color:#bfdbfe;border-color:#1e3a8a}
    .aviso.warn{background:#2b1d05;color:#fde68a;border-color:#78350f}
    .aviso.bad{background:#2a0e0e;color:#fecaca;border-color:#7f1d1d}
    .aviso.ok,.seguro{background:#052e1a;color:#bbf7d0;border-color:#14532d}
  }
</style>
</head>

function el(tag, attrs, ...hijos){
  const n = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v === null || v === undefined || v === false) continue;
    if(k === "class") n.className = v;
    else if(k === "style") n.setAttribute("style", v);
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if(k === "value") n.value = v;
    else if(k === "checked") n.checked = !!v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for(const h of hijos.flat(Infinity)){
    if(h === null || h === undefined || h === false) continue;
    n.appendChild(h instanceof Node ? h : document.createTextNode(String(h)));
  }
  return n;
}
function pintar(...nodos){ $app.replaceChildren(...nodos.flat(Infinity).filter(n=>n!==null&&n!==undefined&&n!==false)); window.scrollTo(0,0); }

const diasDesde = (iso) => { const a=new Date(iso+"T00:00:00"); const h=new Date(); h.setHours(0,0,0,0); return Math.round((h-a)/86400000); };
const fmtFecha = (iso) => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const fmtMonto = (n, mon) => (mon==="USD"?"US$ ":"RD$ ") + Number(n||0).toLocaleString("es-DO",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtFechaMs = (ms) => ms ? new Date(ms).toLocaleDateString("es-DO",{day:"2-digit",month:"short",year:"numeric"}) : "";
function normalizarNombre(s){
  return (s||"").toUpperCase().replace(/Ñ/g,"\u0001").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"Ñ").replace(/[^A-ZÑ' -]/g,"").replace(/\s+/g," ").trim();
}
function nuevoId(){
  const d=new Date(); const p=(n)=>String(n).padStart(2,"0");
  const abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const r=new Uint32Array(4); crypto.getRandomValues(r);
  return "R"+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+"-"+Array.from(r).map(x=>abc[x%abc.length]).join("");
}

// ═══ COMPRESIÓN DE ARCHIVOS ══════════════════════════════════════════════════
function leerDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(file); }); }
async function cargarImagen(file){
  const url = URL.createObjectURL(file);
  try { return await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("No se pudo leer la imagen")); i.src=url; }); }
  finally { setTimeout(()=>URL.revokeObjectURL(url), 1000); }
}
async function prepararArchivo(file){
  const nombre = (file.name||"archivo").slice(0,80);
  if(file.type === "application/pdf" || /\.pdf$/i.test(nombre)){
    if(file.size > MAX_PDF) throw new Error(`El PDF "${nombre}" pesa más de 4 MB. Tómele fotos a las páginas en su lugar.`);
    const durl = await leerDataURL(file);
    return { nombre, mime:"application/pdf", data: durl.split(",")[1], vista:null };
  }
  if(!file.type.startsWith("image/")) throw new Error(`"${nombre}" no es una foto ni un PDF.`);
  const img = await cargarImagen(file);
  let lado = 1800, q = 0.8, out = null;
  const c = document.createElement("canvas"); const ctx = c.getContext("2d");
  for(let i=0; i<10; i++){
    const esc = Math.min(1, lado/Math.max(img.naturalWidth, img.naturalHeight));
    c.width = Math.max(1, Math.round(img.naturalWidth*esc)); c.height = Math.max(1, Math.round(img.naturalHeight*esc));
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    out = c.toDataURL("image/jpeg", q);
    if(out.length < MAX_CHARS) break;
    if(q > 0.55) q -= 0.1; else lado = Math.round(lado*0.8);
  }
  const base = nombre.replace(/\.[^.]+$/,"");
  return { nombre: base+".jpg", mime:"image/jpeg", data: out.split(",")[1], vista: out };
}

async function entrar(key){
  try {
    const snap = await db.collection("clientes").doc(key).get({source:"server"});
    nubeOk();
    if(!snap.exists || !snap.data().activo) return false;
    S.key = key; S.cli = snap.data();
    lsSet("gehch_portal", { token:S.token, key });
    await cargarTodo();
    if(!lsGet("gehch_consent_"+VERSION_CONSENTIMIENTO)) pantallaConsentimiento(); else pantallaInicio();
    return true;
  } catch(e){
    console.warn(e);
    if(e && e.code === "permission-denied"){ nubeOk(); return false; }
    nubeMal(); return false;
  }
}

async function cargarTodo(){
  const [cs, as, rs] = await Promise.all([
    refCli().get({source:"server"}),
    refCli().collection("asegurados").get({source:"server"}),
    refCli().collection("reclamos").get({source:"server"}),
  ]);
  S.cli = cs.data();
  S.asegurados = as.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>PARENTESCOS.indexOf(a.parentesco)-PARENTESCOS.indexOf(b.parentesco) || a.nombre.localeCompare(b.nombre));
  S.reclamos = rs.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.creadoMs||0)-(a.creadoMs||0));
  nubeOk();
}

function conTiempo(promesa, seg, que){
  return Promise.race([promesa, new Promise((_,mal)=>setTimeout(()=>{ const e=new Error("tiempo"); e.code="tiempo-agotado"; e.que=que; mal(e); }, seg*1000))]);
}
function velo(titulo){
  const t = el("div",{class:"muted"},"Preparando…"); const barra = el("i",{style:"width:0%"});
  const v = el("div",{class:"velo"}, el("div",{class:"caja"}, el("b",null,titulo), el("div",{class:"barra"},barra), el("div",{style:"margin-top:8px"},t), el("div",{class:"muted",style:"margin-top:10px;font-size:12px"},"No cierre esta pantalla.")));
  document.body.appendChild(v);
  return { texto:(x)=>{t.textContent=x;}, pct:(n)=>{barra.style.width=n+"%";}, cerrar:()=>v.remove() };
}
function trozos(data){ const t=[]; for(let i=0;i<data.length;i+=MAX_CHARS) t.push(data.slice(i,i+MAX_CHARS)); return t; }

async function subirArchivos(refRec, archivos, marcados, progreso){
  // archivos: [{fid, procIdx, tipoDoc, nombre, mime, data}]
  let hechos = 0;
  for(const a of archivos){
    if(marcados[a.fid]){ hechos++; progreso(hechos); continue; }
    const partes = trozos(a.data);
    const ref = refRec.collection("archivos").doc(a.fid);
    for(let i=1;i<partes.length;i++){
      const k = a.fid+"#"+i;
      if(!marcados[k]){ await conTiempo(ref.collection("partes").doc(String(i)).set({ data: partes[i] }), 120, "documento"); marcados[k]=true; }
    }
    await conTiempo(ref.set({ procIdx:a.procIdx, tipoDoc:a.tipoDoc, nombre:a.nombre, mime:a.mime, partes:partes.length, data:partes[0], creado: Date.now() }), 120, "documento");
    marcados[a.fid] = true; hechos++; progreso(hechos);
  }
}

    p.indicaciones.forEach((a,ai)=>archivos.push({fid:`p${pi+1}-documento-${ai+1}`, procIdx:pi, tipoDoc: (p.etiquetaDoc||"Otro").split(" ")[0], nombre:a.nombre, mime:a.mime, data:a.data}));

  btn.disabled = true; msg.replaceChildren();

    const refRec = refCli().collection("reclamos").doc(r.id);
    try {
      await subirArchivos(refRec, adic.map((a,i)=>({fid:`adicional-${lote}-${i+1}`, procIdx:-1, tipoDoc:"Adicional", nombre:a.nombre, mime:a.mime, data:a.data})), marcados, ()=>{});
      await refRec.update({ adicionalesEnviados: Date.now() });
      nubeOk(); await cargarTodo(); pantallaDetalle(S.reclamos.find(x=>x.id===r.id) || r);
    } catch(e){ console.warn(e); nubeMal(); btn.disabled=false; btn.textContent="Enviar documentos"; msg.replaceChildren(el("div",{class:"aviso bad"},"No se pudo enviar. Revise su internet e intente otra vez.")); }
  }},"Enviar documentos");
  pintar(
    el("button",{class:"link", onclick:()=>pantallaInicio()},"‹ Volver"),
    el("h1",null,`Reclamo ${r.id}`),
    el("div",{style:"margin-bottom:14px"}, chipEstado(etiquetaEstado(r))),
    r.notaAdmin ? el("div",{class:"aviso "+(r.estado==="Rechazado"?"bad":r.estado==="Pagado"?"ok":"warn"), style:"margin-bottom:14px"}, el("b",null, r.estado==="Documentos adicionales" ? (r.origenDocs==="aseguradora" ? `${r.poliza?.aseguradora||"Su aseguradora"} solicita: ` : "Falta lo siguiente: ") : "Mensaje de GEHCH: "), r.notaAdmin.split(/\n/).filter(Boolean).join(" · ")) : null,
    puedeAdjuntar ? el("div",{class:"card"}, el("h2",null,"Enviar documentos solicitados"), zona, msg, btn) : null,
    r.estado==="Documentos adicionales" && r.adicionalesEnviados ? el("div",{class:"aviso ok", style:"margin-bottom:14px"},"Documentos enviados. GEHCH los revisará.") : null,
    el("div",{class:"card"},
      el("div",{class:"li"}, el("span",{class:"muted"},"Paciente"), el("b",null,r.paciente?.nombre||"")),
      el("div",{class:"li"}, el("span",{class:"muted"},"Póliza"), el("b",null,`${r.poliza?.aseguradora||""} · ${r.poliza?.numero||""}`)),
      el("div",{class:"li"}, el("span",{class:"muted"},"Enviado"), el("b",null,fmtFechaMs(r.creadoMs))),
      el("div",{class:"li"}, el("span",{class:"muted"},"Pago"), el("b",null, r.pago?.forma==="Cheque" ? "Cheque" : "Depósito")),
      (r.procedimientos||[]).map(p=>el("div",{class:"li"}, el("div",null, el("div",{style:"font-weight:700"},p.tipo), el("div",{class:"muted"},fmtFecha(p.fecha))), el("b",null,fmtMonto(p.monto,p.moneda))))
    )
  );
}

// Al volver a la pestaña (o cada 5 min), refrescar familia y reclamos si no hay un reclamo a medio llenar
let _ultimaCarga = Date.now();
async function refrescarSiHaceFalta(){
  if(!S.key || S.borrador || document.visibilityState!=="visible" || Date.now()-_ultimaCarga < 60000) return;
  try { await cargarTodo(); _ultimaCarga = Date.now(); if($app.querySelector("h1") && /^Hola/.test($app.querySelector("h1").textContent)) pantallaInicio(); } catch(e){}
}
document.addEventListener("visibilitychange", refrescarSiHaceFalta);
setInterval(refrescarSiHaceFalta, 5*60000);

// ═══ ARRANQUE ════════════════════════════════════════════════════════════════
(async function iniciar(){
  pintarEstado();
  if(!db){ pantallaMensaje("Portal en mantenimiento","El portal aún no está configurado. Escriba a GEHCH."); return; }
  const m = (location.hash||"").match(/t=([A-Za-z0-9]{16,64})/) || (location.search||"").match(/t=([A-Za-z0-9]{16,64})/);
  const guardado = lsGet("gehch_portal");
  S.token = m ? m[1] : (guardado ? guardado.token : null);
  if(!S.token){ pantallaMensaje("Enlace incompleto","Abra el enlace personal que le envió GEHCH por WhatsApp."); return; }
  if(guardado && guardado.token === S.token && guardado.key){
    pintar(el("p",{class:"muted center", style:"margin-top:40px"},"Cargando…"));
    if(await entrar(guardado.key)) return;
    if(!navigator.onLine || errorNube){ pantallaMensaje("Sin conexión","Revise su internet y vuelva a abrir el enlace."); return; }
    lsDel("gehch_portal");
    pantallaPin("Su acceso cambió. Confirme otra vez los 4 dígitos, o pida un enlace nuevo a GEHCH.");
    return;
  }
  pantallaPin();
})();
</script>
